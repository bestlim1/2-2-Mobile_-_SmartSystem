<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #000; /* 검정색 배경 */
        color: white; /* 텍스트 색상 흰색 */
      }
      h3 {
        text-align: center;
        margin-top: 20px;
      }
      .stream-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      img {
        border: 2px solid #fff;
        border-radius: 10px;
        display: block; /* block으로 변경하여 margin 사용 가능 */
        margin-left: auto; /* 왼쪽 여백 자동 */
        margin-right: auto; /* 오른쪽 여백 자동 */
        width: 50%; /* 가로 크기를 50%로 설정 */
        height: auto; /* 세로 비율 자동 조절 */
      }
    </style>
    <title>Streaming</title>
  </head>
  <body>
    <script>
      // 서버로부터 10회 완료 신호를 받으면 창을 닫음
      function checkSquatCount() {
        fetch("/check_squat_count")
          .then((response) => response.json())
          .then((data) => {
            if (data.squat_complete) {
              alert("스쿼트 10회 완료! 창을 닫습니다.");
              window.close(); // 창 닫기
            }
          })
          .catch((error) => console.error("Error:", error));
      }

      // 5초마다 서버에 스쿼트 카운트 확인
      setInterval(checkSquatCount, 1000);
    </script>
    <div class="container-fluid stream-container">
      <div class="col-lg-10">
        <h3></h3>
        <img src="{{ url_for('Stream') }}" />
      </div>
    </div>
  </body>
</html>
